name: متابعة الدورة 70

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل الموقع
        uses: actions/checkout@v4
      - name: إعداد بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: فحص المصادر الرسمية
        run: python scripts/course70_monitor.py
      - name: حفظ التحديث عند وجوده
        run: |
          if git diff --quiet -- reports/course-70-monitor.html data/course70-monitor-state.json; then
            echo "لا يوجد تحديث جديد"
          else
            git config user.name "kfsc Course 70 Monitor"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/course-70-monitor.html data/course70-monitor-state.json
            git commit -m "تحديث متابعة الدورة 70"
            git push
          fi
